name: CI

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

# Install the pinned 0.2 engine from its next2 git commit.

on:
  push:
    branches: [main, next2]
  pull_request:

# Jobs carry an explicit timeout-minutes: without one GitHub applies a
# 360-minute default, long enough for a stalled job to go unnoticed.

jobs:
  # The job name is load-bearing: branch protection requires the contexts
  # `tests (8.2)`, `tests (8.3)` and `tests (8.4)`, which GitHub derives from
  # this job id plus the matrix value. A `name:` override here renames the
  # contexts, and the required ones then never report, so the PR blocks forever.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: composer update --prefer-dist --no-progress
      - name: Verify installed engine version
        run: |
          composer show markup-carve/carve-php --format=json | php -r '$package = json_decode(stream_get_contents(STDIN), true); exit(($package["source"]["reference"] ?? "") === "6ceebc52181efc1f5dfe6f5e7964b75c43f13a90" ? 0 : 1);'
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse
        if: matrix.php-version == '8.2'
      - run: vendor/bin/phpcs
        if: matrix.php-version == '8.2'
