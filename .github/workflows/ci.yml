name: CI

# Installs what composer.json declares, so a green run says the package works
# for someone who installs it from Packagist.

on:
  push:
    branches: [main, next]
  pull_request:

# Jobs carry an explicit timeout-minutes: without one GitHub applies a
# 360-minute default, long enough for a stalled job to go unnoticed.

jobs:
  # The job name is load-bearing: branch protection requires the contexts
  # `tests (8.2)`, `tests (8.3)` and `tests (8.4)`, which GitHub derives from
  # this job id plus the matrix value. A `name:` override here renames the
  # contexts, and the required ones then never report, so the PR blocks forever.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: composer update --prefer-dist --no-progress
      - run: composer show markup-carve/carve-php | grep '^versions'
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse
        if: matrix.php-version == '8.2'
      - run: vendor/bin/phpcs
        if: matrix.php-version == '8.2'
